name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint · types · tests (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type check (mypy strict)
        run: mypy
      - name: Tests (unit + real-stdio e2e)
        run: pytest -q

  docker:
    name: docker build + offline demo run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mining-brief-agent:ci .
      - name: Run the demo query offline end-to-end
        run: docker run --rm mining-brief-agent:ci --offline
