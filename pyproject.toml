[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mining-brief-agent"
version = "0.1.0"
description = "MCP-based mining rights daily brief agent: 3 MCP servers (news / NI 43-101 PDF / prices) + 1 orchestration client that generates a Markdown daily brief."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "An" }]
keywords = ["mcp", "mining", "agent", "ni-43-101", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2.3,<3",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "feedparser>=6.0,<7",
  "beautifulsoup4>=4.12,<5",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-beautifulsoup4",
  "reportlab>=4.0",
]

[project.scripts]
mining-news-mcp = "mining_news_mcp.server:main"
mineral-pdf-mcp = "mineral_pdf_mcp.server:main"
lme-price-mcp = "lme_price_mcp.server:main"
mining-brief = "mining_brief_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/mining_brief_core",
  "src/mining_news_mcp",
  "src/mineral_pdf_mcp",
  "src/lme_price_mcp",
  "src/mining_brief_agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = ["e2e: end-to-end tests that spawn real MCP server processes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "DTZ",      # datetime timezone hygiene
  "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src"]
